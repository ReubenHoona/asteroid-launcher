<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- only root owns the name; everyone may call it: a wrong try costs the same for anyone and
       changing the credential needs the old one -->
  <policy user="root">
    <allow own="org.asteroidos.LockHelper"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.asteroidos.LockHelper"/>
  </policy>
</busconfig>
